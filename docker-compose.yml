services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecoroute}
      POSTGRES_USER: ${POSTGRES_USER:-ecoroute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecoroute}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine

  api:
    build: ./backend
    command: sh -c "python manage.py migrate && gunicorn ecoroute_api.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./backend
    command: celery -A ecoroute_api worker -l INFO
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
